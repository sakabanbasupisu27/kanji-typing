<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>漢字タイピングゲーム</title>
<style>
    body {
      margin: 0;
      padding: 15px;
      padding-left: 175px; /* PC用の左側余白 */
      background-color: #f4f7f6;
      box-sizing: border-box;
      height: 100vh;
      font-family: sans-serif;
      
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .ad-space {
      width: 160px;
      height: 100%;
      background-color: #e0e6ed;
      border: 2px dashed #b0bec5;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #78909c;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    /* --- ★ここから下がスマホ用の自動切り替え設定（追加・修正） --- */
    @media screen and (max-width: 768px) {
      body {
        padding-left: 10px !important;
        padding-right: 10px !important;
        padding-top: 10px !important;
        padding-bottom: 10px !important;
        flex-direction: column !important;
        height: auto !important;
        min-height: 100vh;
      }

      .ad-space {
        display: none !important; /* スマホでは右側の広告スペースを非表示にして画面を広く使う */
      }

      .box {
        width: 100% !important;
        height: 85vh !important;
        min-height: 500px;
      }

      h1 {
        font-size: 55px !important; /* スマホ画面に合わせてタイトル文字を調整 */
        margin-bottom: 30px !important;
      }
    }
    /* --- ★ここまで --- */

    .box {
      position: relative;
      border: 6px solid #3498db; 
      background-color: #ffffff;
      border-radius: 12px;
      flex: 1;
      height: 100%;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .screen-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* --- 管理者ボタン（左下に正方形配置） --- */
    .btn-admin-square {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 80px;
      height: 80px;
      background-color: #34495e;
      color: white;
      border: 3px solid #2c3e50;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      z-index: 10;
    }

    .btn-admin-square:hover {
      background-color: #2c3e50;
      transform: scale(1.05);
    }

    .btn-admin-square .icon {
      font-size: 24px;
      margin-bottom: 2px;
    }

    /* --- メニュー画面 --- */
    h1 {
      font-size: 110px;
      color: #333;
      margin-top: 0;
      margin-bottom: 80px;
      letter-spacing: 2px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 400px;
    }

    .btn-main {
      width: 100%;
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 22px 0;
      font-size: 34px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-main:hover {
      background-color: #27ae60;
    }

    .btn-sub {
      width: 100%;
      background-color: #ecf0f1;
      color: #34495e;
      border: 2px solid #bdc3c7;
      padding: 16px 0;
      font-size: 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-sub:hover {
      background-color: #bdc3c7;
      border-color: #95a5a6;
    }

    .btn-ranking {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 110px;
      height: 110px;
      background-color: #f1c40f;
      color: #7f6000;
      border: 3px solid #f39c12;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-ranking:hover {
      background-color: #f39c12;
      color: #ffffff;
    }

    .btn-ranking .icon {
      font-size: 32px;
      margin-bottom: 4px;
    }

    /* --- コース・難易度選択画面 --- */
    .screen-title {
      font-size: 48px;
      color: #333;
      margin-top: 0;
      margin-bottom: 30px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 35px;
    }

    .btn-category {
      background-color: #ffffff;
      color: #34495e;
      border: 3px solid #3498db;
      padding: 18px 0;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-category:hover {
      background-color: #ebf5fb;
    }

    .btn-category.selected {
      background-color: #3498db;
      color: white;
    }

    .difficulty-section {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .difficulty-section.active {
      opacity: 1;
      pointer-events: auto;
    }

    .difficulty-title {
      font-size: 22px;
      color: #7f8c8d;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .difficulty-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-difficulty {
      width: 100%;
      padding: 16px 0;
      font-size: 26px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-difficulty:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-easy { background-color: #2ecc71; }
    .btn-normal { background-color: #e67e22; }
    .btn-hard { background-color: #e74c3c; }

    .btn-back {
      position: absolute;
      top: 25px;
      left: 25px;
      background-color: #95a5a6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-back:hover {
      background-color: #7f8c8d;
    }

    /* --- プレイ画面 --- */
    .info-bar {
      display: flex;
      gap: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 5px;
    }

    .timer-circle {
      position: absolute;
      top: 25px;
      right: 25px;
      width: 130px;
      height: 130px;
      background-color: #ffffff;
      border: 5px solid #e74c3c;
      border-radius: 50%;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      
      color: #e74c3c;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .timer-circle .label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .timer-circle .time-num {
      font-size: 42px;
      font-weight: bold;
      line-height: 1;
    }

    .timer-circle .time-num.endless {
      font-size: 28px;
      color: #2ecc71;
    }

    .timer-circle.endless-border {
      border-color: #2ecc71;
    }

    .typed-kana-display {
      font-size: 30px;
      color: #2ecc71;
      font-weight: bold;
      letter-spacing: 3px;
      min-height: 32px;
      margin-bottom: -15px;
      z-index: 2;
    }

    .kanji-display {
      font-size: 95px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 0px;
    }

    .hint-display {
      font-size: 26px;
      color: #e67e22;
      font-weight: bold;
      letter-spacing: 4px;
      min-height: 30px;
      margin: 0px;
      font-family: monospace;
    }

    .romaji-display {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 4px;
      font-family: monospace;
      min-height: 48px;
      color: #2ecc71;
      margin-top: -5px;
    }

    /* --- 終了バナー --- */
    .game-over-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 80%;
      max-width: 600px;
      background-color: rgba(231, 76, 60, 0.95);
      color: white;
      font-size: 64px;
      font-weight: bold;
      text-align: center;
      padding: 30px 0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 100;
      letter-spacing: 4px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .game-over-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* --- 結果画面のスタイル --- */
    .result-title {
      font-size: 44px;
      color: #2c3e50;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .rank-in-notice {
      font-size: 22px;
      color: #f39c12;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 28px;
    }

    .result-score-box {
      font-size: 38px;
      color: #27ae60;
      font-weight: bold;
      margin-bottom: 25px;
      background-color: #e8f8f5;
      padding: 15px 40px;
      border-radius: 16px;
      border: 3px dashed #2ecc71;
    }

    .result-details {
      display: flex;
      gap: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 30px;
      background-color: #f8f9fa;
      padding: 15px 25px;
      border-radius: 12px;
      border: 2px solid #e0e6ed;
    }

    .result-details span {
      color: #2980b9;
    }

    .result-button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-sub-result {
      width: 100%;
      background-color: #95a5a6;
      color: white;
      border: none;
      padding: 16px 0;
      font-size: 22px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-sub-result:hover {
      background-color: #7f8c8d;
    }

    /* --- ランキング画面のスタイル --- */
    .ranking-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ranking-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      width: 100%;
      justify-content: center;
    }

    .btn-tab {
      background-color: #ecf0f1;
      color: #7f8c8d;
      border: none;
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tab.active {
      background-color: #f39c12;
      color: white;
      box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
    }

    .ranking-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
      max-height: 320px;
      overflow-y: auto;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8f9fa;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #34495e;
      border: 2px solid #e0e6ed;
    }

    .ranking-item.is-me {
      border: 3px solid #3498db !important;
      background-color: #ebf5fb !important;
    }

    .ranking-item:nth-child(1) { border-color: #f1c40f; background-color: #fef9e7; }
    .ranking-item:nth-child(2) { border-color: #bdc3c7; background-color: #f2f4f4; }
    .ranking-item:nth-child(3) { border-color: #e67e22; background-color: #fbf5ef; }

    .rank-num {
      width: 35px;
      text-align: left;
    }

    .rank-score {
      color: #27ae60;
    }

    .no-record {
      text-align: center;
      color: #95a5a6;
      font-size: 20px;
      font-weight: bold;
      padding: 40px 0;
    }

    /* --- 設定・管理者画面のスタイル --- */
    .settings-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 450px;
      background-color: #f8f9fa;
      padding: 30px;
      border-radius: 16px;
      border: 2px solid #e0e6ed;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }

    .form-group label {
      font-size: 20px;
      font-weight: bold;
      color: #34495e;
    }

    .warning-text {
      color: #e74c3c;
      font-size: 15px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      font-size: 22px;
      border: 2px solid #bdc3c7;
      border-radius: 10px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #3498db;
    }

    .error-msg {
      color: #e74c3c;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- メインゲームエリア -->
  <div class="box">

    <!-- 左下の正方形管理者ボタン -->
    <button id="admin-square-btn" class="btn-admin-square" onclick="openPasswordModal()">
      <span class="icon">⚙️</span>
      <span>管理者</span>
    </button>

    <!-- タイムアップ時の横長バナー -->
    <div id="game-over-banner" class="game-over-banner">終了！</div>

    <!-- 1. メインメニュー画面 -->
    <div id="menu-screen" class="screen-content">
      <h1>漢字タイピング</h1>

      <div class="button-group">
        <button id="start-btn" class="btn-main">スタート</button>
        <button class="btn-sub">あそびかた</button>
        <button id="settings-btn" class="btn-sub">設定</button>
      </div>

      <button id="ranking-btn" class="btn-ranking">
        <span class="icon">👑</span>
        <span>ランキング</span>
      </button>
    </div>

    <!-- 2. コース＆難易度選択画面 -->
    <div id="select-screen" class="screen-content hidden">
      <button id="back-to-menu-btn" class="btn-back">← もどる</button>
      <h2 class="screen-title">コースを えらんでね</h2>

      <div class="category-grid">
        <button class="btn-category" data-cat="練習">練習</button>
        <button class="btn-category" data-cat="普通">普通</button>
        <button class="btn-category" data-cat="小1,2">小1,2</button>
        <button class="btn-category" data-cat="小3,4">小3,4</button>
        <button class="btn-category" data-cat="小5,6">小5,6</button>
        <button class="btn-category" data-cat="中学">中学</button>
      </div>

      <div id="difficulty-section" class="difficulty-section">
        <div class="difficulty-title">▼ むずかしさを えらんで スタート！</div>
        <div class="difficulty-group">
          <button class="btn-difficulty btn-easy" data-diff="簡単">簡単</button>
          <button class="btn-difficulty btn-normal" data-diff="普通">普通</button>
          <button class="btn-difficulty btn-hard" data-diff="難しい">難しい</button>
        </div>
      </div>
    </div>

    <!-- 3. タイピングプレイ画面 -->
    <div id="play-screen" class="screen-content hidden">
      <button id="back-to-select-btn" class="btn-back">← やめる</button>

      <div id="timer-box" class="timer-circle">
        <span class="label">制限時間</span>
        <span id="timer-num" class="time-num">60</span>
      </div>

      <div class="info-bar">
        <div id="current-mode">コース: - / -</div>
        <div id="score-display">スコア: 0</div>
        <div id="combo-display">コンボ: 0</div>
      </div>

      <div id="typed-kana-text" class="typed-kana-display"></div>
      <div id="kanji-text" class="kanji-display">漢字</div>
      <div id="hint-text" class="hint-display"></div>

      <div class="romaji-display">
        <span id="typed-text"></span>
      </div>
    </div>

    <!-- 4. 結果発表画面 -->
    <div id="result-screen" class="screen-content hidden">
      <div class="result-title">結果！</div>
      <div id="rank-in-notice" class="rank-in-notice"></div>
      <div id="result-correct-count" class="result-score-box">0問正解！</div>
      
      <div class="result-details">
        <div>正しく打てた数: <span id="res-typed-chars">0</span>文字</div>
        <div>難易度: <span id="res-difficulty">-</span></div>
        <div>ミスタイプ数: <span id="res-miss-count">0</span>回</div>
      </div>

      <div class="result-button-group">
        <button id="back-to-select-from-result" class="btn-main" style="padding: 16px 0; font-size: 24px;">もういちど遊ぶ</button>
        <button id="back-to-menu-from-result" class="btn-sub-result">終わる</button>
      </div>
    </div>

    <!-- 5. ランキング画面 -->
    <div id="ranking-screen" class="screen-content hidden">
      <button id="back-to-menu-from-ranking" class="btn-back">← もどる</button>
      <h2 class="screen-title" style="margin-bottom: 20px;">ランキング</h2>

      <div class="ranking-container">
        <div class="ranking-tabs">
          <button class="btn-tab active" data-tab="monthly">月間</button>
          <button class="btn-tab" data-tab="weekly">週間</button>
          <button class="btn-tab" data-tab="daily">今日</button>
        </div>

        <div id="ranking-list" class="ranking-list"></div>
      </div>
    </div>

    <!-- 6. 設定画面（ニックネーム変更） -->
    <div id="settings-screen" class="screen-content hidden">
      <button id="back-to-menu-from-settings" class="btn-back">← もどる</button>
      <h2 class="screen-title" style="margin-bottom: 25px;">設定</h2>

      <div class="settings-form">
        <div class="form-group">
          <label for="nickname-input">ニックネーム（半角英数字のみ）</label>
          <div class="warning-text">※本名は入力しないでください</div>
          <input type="text" id="nickname-input" maxlength="12" placeholder="例: Player123">
          <div id="nickname-error" class="error-msg"></div>
        </div>

        <button id="save-nickname-btn" class="btn-main" style="padding: 14px 0; font-size: 24px;">保存する</button>
      </div>
    </div>

    <!-- 7. 管理者専用パネル画面 -->
    <div id="admin-screen" class="screen-content hidden">
      <button id="back-to-menu-from-admin" class="btn-back">← もどる</button>
      <h2 class="screen-title" style="margin-bottom: 25px;">管理者設定</h2>

      <div class="settings-form" style="max-width: 500px;">
        <div class="form-group">
          <label for="admin-time-input">制限時間（秒）</label>
          <input type="number" id="admin-time-input" min="5" max="300" value="60">
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label>ランキングデータ操作</label>
          <button id="admin-reset-ranking-btn" class="btn-sub-result" style="background-color: #e74c3c;" onclick="resetRankingData()">ランキング初期化（GAS側で削除）</button>
        </div>

        <button id="admin-save-btn" class="btn-main" style="padding: 14px 0; font-size: 24px; margin-top: 10px;" onclick="saveAdminSettings()">設定を保存する</button>
      </div>
    </div>

  </div>

  <!-- 右側広告スペース -->
  <div class="ad-space">広告エリア（右）</div>

  <!-- パスワード入力モーダル -->
  <div id="admin-password-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; border:3px solid #34495e; z-index:1000; box-shadow:0 10px 30px rgba(0,0,0,0.3); border-radius:16px; text-align:center; width:90%; max-width:350px;">
    <h3 style="margin-top:0; color:#34495e; font-size:24px;">管理者パスワード</h3>
    <input type="password" id="admin-pass-input" placeholder="パスワードを入力" style="width:100%; padding:12px; font-size:20px; border:2px solid #bdc3c7; border-radius:8px; box-sizing:border-box; margin-bottom:15px; text-align:center;">

    function parseKanaToTree(kanaStr) {
      let nodes = [];
      let i = 0;
      while (i < kanaStr.length) {
        let char = kanaStr[i];
        let nextChar = kanaStr[i + 1] || '';

        if (char === 'っ') {
          nodes.push({ kana: 'っ', isSmallTsu: true });
          i++;
          continue;
        }

        let combo = char + nextChar;
        if (ROMAJI_TABLE[combo]) {
          nodes.push({ kana: combo, patterns: ROMAJI_TABLE[combo] });
          i += 2;
          continue;
        }

        if (ROMAJI_TABLE[char]) {
          nodes.push({ kana: char, patterns: ROMAJI_TABLE[char] });
          i++;
          continue;
        }

        nodes.push({ kana: char, patterns: [char] });
        i++;
      }

      for (let k = 0; k < nodes.length; k++) {
        if (nodes[k].isSmallTsu) {
          let nextNode = nodes[k + 1];
          let patterns = ['ltu', 'xtu'];
          if (nextNode && nextNode.patterns) {
            nextNode.patterns.forEach(p => {
              patterns.push(p[0]);
            });
          }
          nodes[k].patterns = Array.from(new Set(patterns));
        }
      }
      return nodes;
    }

    function playCorrectSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function openPasswordModal() {
      const modal = document.getElementById('admin-password-modal');
      if (modal) {
        modal.style.display = 'block';

        document.getElementById('admin-pass-msg').innerText = '';
        document.getElementById('admin-pass-input').focus();
      }

    function closePasswordModal() {
      const modal = document.getElementById('admin-password-modal');
      if (modal) modal.style.display = 'none';
    }

    function verifyAdminPassword() {
      const pass = document.getElementById('admin-pass-input').value;
      const msg = document.getElementById('admin-pass-msg');
      if (!pass) { msg.innerText = "パスワードを入力してください"; return; }
      msg.style.color = "blue";
      msg.innerText = "照合中...";

      fetch(`${GAS_URL}?action=verifyAdmin&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success || data.status === "ok") {
            closePasswordModal();
            adminTimeInput.value = gameTimeLimit;
            menuScreen.classList.add('hidden');
            adminScreen.classList.remove('hidden');
          } else {
            msg.style.color = "red";
            msg.innerText = "パスワードが違います";
          }
        })
        .catch(err => {
          if (pass === ADMIN_PASSWORD) {
            closePasswordModal();
            adminTimeInput.value = gameTimeLimit;
            menuScreen.classList.add('hidden');
            adminScreen.classList.remove('hidden');
          } else {
            msg.style.color = "red";
            msg.innerText = "認証エラー";
          }
        });
    }

    function saveAdminSettings() {
      const newTime = Number(adminTimeInput.value);
      if (newTime >= 5 && newTime <= 300) {
        fetch(`${GAS_URL}?action=saveSettings&time=${encodeURIComponent(newTime)}`)
          .then(res => res.json())
          .then(data => {
            gameTimeLimit = newTime;
            alert(`制限時間を ${gameTimeLimit} 秒に保存しました！全員に反映されます。`);
            adminScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
          })
          .catch(e => alert("サーバーへの保存に失敗しました。"));
      } else {
        alert("制限時間は5秒〜300秒の間で設定してください。");
      }
    }

function resetRankingData() {
  const btn = document.getElementById("admin-reset-ranking-btn"); // 管理者画面の初期化ボタンのIDに合わせて調整

  if (!isConfirmingReset) {
    // 1回目のクリック：確認状態にする（ポップアップを出さない）

    if (btn) {
      btn.textContent = "本当に初期化しますか？(再度クリック)";

    } else {
      alert("もう一度「ランキング初期化」ボタンを押すと実行されます。");

    // 5秒以内に2回目が押されなかったら元に戻す
    setTimeout(() => {
      if (isConfirmingReset) {
        resetButtonState();
      }
    }, 5000);

  // 2回目のクリック：実際にGASへリセットをリクエストする

    .then(res => res.json())
    .then(data => {
      // alertの代わりに画面内のテキストやコンソール等で通知、またはそのままalert
      console.log("ランキングデータをリセットしました！");

    async function switchRankingTab(tabType) {
      rankingListElem.innerHTML = `<div class="no-record">読み込み中...</div>`;
      
      const data = await loadOnlineRankings();
      rankingListElem.innerHTML = "";
      
      if (!data || data.length === 0) {
        rankingListElem.innerHTML = `<div class="no-record">まだ記録がありません</div>`;
        return;
      }

      const now = new Date();

      // 月間・週間・今日の条件に合わせてデータを絞り込む
      const filtered = data.filter(item => {
        if (!item.timestamp) return true; // タイムスタンプがないデータはそのまま表示
        const itemDate = new Date(item.timestamp);

        if (tabType === "daily") {
          // 今日（年・月・日が同じ）
          return itemDate.getFullYear() === now.getFullYear() &&
                 itemDate.getMonth() === now.getMonth() &&
                 itemDate.getDate() === now.getDate();
        } else if (tabType === "weekly") {
          // 週間（過去7日以内）
          const diffTime = now - itemDate;
          const diffDays = diffTime / (1000 * 60 * 60 * 24);
          return diffDays <= 7;
        } else if (tabType === "monthly") {
          // 月間（今月：年と月が同じ）
          return itemDate.getFullYear() === now.getFullYear() &&
                 itemDate.getMonth() === now.getMonth();
        }
        return true;
      });

      if (filtered.length === 0) {
        rankingListElem.innerHTML = `<div class="no-record">この期間の記録はありません</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const rank = index + 1;
        const isMe = item.name === playerNickname;
        const row = document.createElement('div');
        row.className = `ranking-item ${isMe ? 'is-me' : ''}`;
        row.innerHTML = `
          <div><span class="rank-num">${rank}位</span> ${item.name} ${isMe ? '（あなた）' : ''}</div>
          <div class="rank-score">${item.score}問正解</div>
        `;
        rankingListElem.appendChild(row);
      });
    }

    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedCategory = btn.dataset.cat;
        difficultySection.classList.add('active');
      });
    });

    difficultyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedDifficulty = btn.dataset.diff;
        selectScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        startGame();
      });
    });

    function resetSelection() {
      selectedCategory = null;
      categoryBtns.forEach(b => b.classList.remove('selected'));
      difficultySection.classList.remove('active');
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startGame() {
      let filteredWords = [];
      if (selectedCategory === "中学") {
        if (selectedDifficulty === "簡単") {
          filteredWords = wordList.filter(w => w.category === "中学" && w.grade === 1);
        } else if (selectedDifficulty === "普通") {
          filteredWords = wordList.filter(w => w.category === "中学" && (w.grade === 1 || w.grade === 2));
        } else if (selectedDifficulty === "難しい") {
          filteredWords = wordList.filter(w => w.category === "中学");
        }
      } else {
        filteredWords = wordList.filter(w => w.category === selectedCategory && (selectedDifficulty === "簡単" ? w.grade === 1 : selectedDifficulty === "普通" ? w.grade === 2 : w.grade === 3));
      }
      
      if (filteredWords.length === 0) {
        filteredWords = wordList.filter(w => w.category === selectedCategory);
        if (filteredWords.length === 0) {
          filteredWords = wordList;
        }
      }

      currentCourseWords = shuffleArray([...filteredWords]);

      score = 0;
      combo = 0;
      correctWordCount = 0;
      totalTypedChars = 0;
      missCount = 0;
      timeLeft = gameTimeLimit;
      currentWordIndex = 0;
      isPlaying = true;
      gameOverBanner.classList.remove('show');
      resultScreen.classList.add('hidden');

      currentModeText.textContent = `コース: ${selectedCategory} / ${selectedDifficulty}`;
      scoreDisplay.textContent = `スコア: ${score}`;
      comboDisplay.textContent = `コンボ: ${combo}`;
      
      if (selectedCategory === "練習") {
        timerNumElem.textContent = "無制限";
        timerNumElem.classList.add('endless');
        timerBox.classList.add('endless-border');
      } else {
        timerNumElem.textContent = timeLeft;
        timerNumElem.classList.remove('endless');
        timerBox.classList.remove('endless-border');
        startTimer();
      }

      loadWord();
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        timerNumElem.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    async function endGame() {
      stopGame();
      gameOverBanner.classList.add('show');
      const achievedRank = await saveScoreToRankings(correctWordCount);

      setTimeout(() => {
        gameOverBanner.classList.remove('show');
        playScreen.classList.add('hidden');
        
        if (achievedRank > 0) {
          rankInNotice.textContent = `🎉 ランキング ${achievedRank}位 にランクイン！`;
        } else {
          rankInNotice.textContent = "";
        }

        resCorrectCount.textContent = `${correctWordCount}問正解！`;
        resTypedChars.textContent = totalTypedChars;
        resDifficulty.textContent = `${selectedCategory} / ${selectedDifficulty}`;
        resMissCount.textContent = missCount;

        resultScreen.classList.remove('hidden');
      }, 1500);
    }

    function stopGame() {
      isPlaying = false;
      clearInterval(timerId);
    }

    function loadWord() {
      if (currentWordIndex >= currentCourseWords.length) {
        shuffleArray(currentCourseWords);
        currentWordIndex = 0;
      }
      const word = currentCourseWords[currentWordIndex];
      kanjiText.textContent = word.kanji;
      
      currentKanaIndex = 0;
      currentTypedInNode = "";
      accumulatedTyped = "";
      hintStep = 0;
      hintTextElem.textContent = "";

      fullTargetRomaji = word.kanaMap.map(item => item.patterns[0]).join('');

      updateDisplay();
    }

    function updateDisplay() {
      const word = currentCourseWords[currentWordIndex];
      
      let completedKana = "";
      for (let i = 0; i < currentKanaIndex; i++) {
        completedKana += word.kanaMap[i].kana;
      }
      if (word.kanaMap[currentKanaIndex] && word.kanaMap[currentKanaIndex].kana === "ん" && currentTypedInNode === "n") {
        completedKana += "ん";
      }

      typedKanaTextElem.textContent = completedKana;
      typedTextElem.textContent = accumulatedTyped;
    }

    window.addEventListener('keydown', (e) => {
      if (!isPlaying) return;

      const word = currentCourseWords[currentWordIndex];

      if (e.key === "Enter") {
        e.preventDefault();
        if (hintStep < fullTargetRomaji.length) {
          hintStep++;
          hintTextElem.textContent = fullTargetRomaji.substring(0, hintStep);
        }
        return;
      }

      if (e.key.length !== 1) return;
      const key = e.key.toLowerCase();

      let activeNode = word.kanaMap[currentKanaIndex];
      if (!activeNode) return;

      if (activeNode.kana === "ん") {
        if (currentTypedInNode === "") {
          if (key === "n") {
            currentTypedInNode = "n";
            accumulatedTyped += key;
            totalTypedChars++;
            updateDisplay();
            return;
          }
        } else if (currentTypedInNode === "n") {
          if (key === "n") {
            currentTypedInNode = "";
            accumulatedTyped += key;
            totalTypedChars++;
            currentKanaIndex++;
            score += 10;
            scoreDisplay.textContent = `スコア: ${score}`;

            if (checkWordCompleted(word)) return;
            updateDisplay();
            return;
          } else {
            let nextNode = word.kanaMap[currentKanaIndex + 1];
            if (nextNode && nextNode.patterns.some(p => p.startsWith(key))) {
              currentKanaIndex++;
              currentTypedInNode = key;
              accumulatedTyped += key;
              totalTypedChars++;
              score += 10;
              scoreDisplay.textContent = `スコア: ${score}`;

              let isNodeCompleted = nextNode.patterns.includes(currentTypedInNode);
              if (isNodeCompleted) {
                currentKanaIndex++;
                currentTypedInNode = "";
              }

              if (checkWordCompleted(word)) return;
              updateDisplay();
              return;
            }
          }
        }
      }

      let nextTyped = currentTypedInNode + key;

      let isDoubleConsonantComplete = false;
      if (activeNode.kana === "っ") {
        let nextNode = word.kanaMap[currentKanaIndex + 1];
        if (nextNode) {
          let matchesNext = nextNode.patterns.some(p => p.startsWith(key));
          if (matchesNext && currentTypedInNode === key) {
            isDoubleConsonantComplete = true;
          }
        }
      }

      let isValidMatch = activeNode.patterns.some(p => p.startsWith(nextTyped));

      if (isValidMatch && !isDoubleConsonantComplete) {
        currentTypedInNode = nextTyped;
        accumulatedTyped += key;
        totalTypedChars++;
        score += 10;
        scoreDisplay.textContent = `スコア: ${score}`;

        let isNodeCompleted = activeNode.patterns.includes(currentTypedInNode);
        if (isNodeCompleted) {
          currentKanaIndex++;
          currentTypedInNode = "";

          if (checkWordCompleted(word)) return;
        }

        updateDisplay();
      } else if (isDoubleConsonantComplete) {
        accumulatedTyped += key;
        totalTypedChars++;
        currentKanaIndex++;
        currentTypedInNode = "";

        let nextActiveNode = word.kanaMap[currentKanaIndex];
        if (nextActiveNode && nextActiveNode.patterns.some(p => p.startsWith(key))) {
          currentTypedInNode = key;
          let isNodeCompleted = nextActiveNode.patterns.includes(currentTypedInNode);
          if (isNodeCompleted) {
            currentKanaIndex++;
            currentTypedInNode = "";
          }
        }

        score += 10;
        scoreDisplay.textContent = `スコア: ${score}`;

        if (checkWordCompleted(word)) return;
        updateDisplay();
      } else {
        playMissSound();
        combo = 0;
        comboDisplay.textContent = `コンボ: ${combo}`;
        missCount++;
      }
    });

    function checkWordCompleted(word) {
      if (currentKanaIndex >= word.kanaMap.length) {
        playCorrectSound();
        combo++;
        correctWordCount++;
        comboDisplay.textContent = `コンボ: ${combo}`;

        if (selectedCategory !== "練習") {
          if (combo % TIME_BONUS_COMBO_THRESHOLD === 0) {
            timeLeft += TIME_BONUS_SECONDS;
            timerNumElem.textContent = timeLeft;
          }
        }

        currentWordIndex++;
        setTimeout(loadWord, 150);
        return true;
      }
      return false;
    }

    // --- 起動時にサーバーから制限時間を取得する ---
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${GAS_URL}?action=getSettings`)
        .then(res => res.json())
        .then(data => {
          if (data && data.timeLimit) {
            gameTimeLimit = parseInt(data.timeLimit);
            const timerNum = document.getElementById('timer-num');
            if (timerNum) timerNum.innerText = gameTimeLimit;
          }
        })
        .catch(e => console.log("設定ロード失敗"));
    });
    // ランキングを取得して画面に表示する関数
async function fetchAndDisplayRanking() {
  try {
    const response = await fetch(GAS_URL + "?action=getRanking");
    const result = await response.json();
    
    if (!result.success || !result.rankings) {
      console.warn("ランキングデータの取得に失敗しました");
      return;
    }
    
    const rankings = result.rankings;
    const listElement = document.getElementById("ranking-list");
    if (!listElement) return;
    
    listElement.innerHTML = ""; // 一旦クリア

    rankings.slice(0, 5).forEach((player, index) => {
      const li = document.createElement("li");
      li.textContent = `${index + 1}位: ${player.name} - ${player.score}点`;
      listElement.appendChild(li);
    });

  } catch (error) {
    console.error("ランキング取得エラー:", error);
  }
}
    // 管理者：ランキング初期化ボタンが押されたときの処理
async function resetRankingData() {
  // パスワード認証モーダルを表示するか、直接リセット処理を行うか
  // （すでにパスワード認証を通っている管理者パネル内なので、直接リセットを実行します）
  if (!confirm("本当にランキングデータを初期化（削除）しますか？")) {
    return;
  }

  try {
    const response = await fetch(GAS_URL + "?action=resetRanking");
    const result = await response.json();

    if (result.success) {
      alert("ランキングを初期化しました！");
    } else {
      alert("初期化に失敗しました: " + (result.message || "不明なエラー"));
    }
  } catch (error) {
    console.error("初期化通信エラー:", error);
    alert("通信エラーが発生しました。");
  }
}
